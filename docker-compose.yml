services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/openapi/v1.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
